# 🧪 CI: Runs checks & build for every pull request

name: 🧪 CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: ✅ Format / deadnix / statix
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧊 Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔍 Run static checks (current system only)
        run: |
          nix build \
            .#checks.x86_64-linux.format-check \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.statix \
            --no-link --print-out-paths

  build-profiles:
    name: 🔨 Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, cpp, rust, python, java, full]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧊 Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔨 Build ${{ matrix.profile }} (x86_64-linux)
        run: nix build .#${{ matrix.profile }} --print-out-paths

  devshell:
    name: 🧑‍💻 Dev shell
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧊 Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🧑‍💻 Test dev shell
        run: nix develop --command echo "Dev shell works!"
