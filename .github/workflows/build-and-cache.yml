# 🚀 Build & Cache
#
# Builds SchroVimger profiles for supported systems and pushes
# the resulting Nix closures to Cachix.
#
# Linux:
#   - x86_64-linux: all profiles
#   - aarch64-linux: minimal + full smoke tests
#
# macOS:
#   - aarch64-darwin: minimal + full smoke tests

name: 🚀 Build & Cache

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build profiles
  # ─────────────────────────────────────────────────────────────
  build-and-cache:
    name: 📦 ${{ matrix.profile }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ─────────────────────────────────────────────────────
          # x86_64-linux
          # Build every profile
          # ─────────────────────────────────────────────────────

          - profile: minimal
            system: x86_64-linux
            runner: ubuntu-latest

          - profile: cpp
            system: x86_64-linux
            runner: ubuntu-latest

          - profile: rust
            system: x86_64-linux
            runner: ubuntu-latest

          - profile: python
            system: x86_64-linux
            runner: ubuntu-latest

          - profile: java
            system: x86_64-linux
            runner: ubuntu-latest

          - profile: full
            system: x86_64-linux
            runner: ubuntu-latest

          # ─────────────────────────────────────────────────────
          # aarch64-linux
          # Smoke test only
          # ─────────────────────────────────────────────────────

          - profile: minimal
            system: aarch64-linux
            runner: ubuntu-24.04-arm

          - profile: full
            system: aarch64-linux
            runner: ubuntu-24.04-arm

          # ─────────────────────────────────────────────────────
          # aarch64-darwin
          # Smoke test only
          # ─────────────────────────────────────────────────────

          - profile: minimal
            system: aarch64-darwin
            runner: macos-latest

          - profile: full
            system: aarch64-darwin
            runner: macos-latest
            container: ""

    steps:
      # ─────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────

      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      # ─────────────────────────────────────────────────────────
      # Nix
      # ─────────────────────────────────────────────────────────

      - name: 🧊 Install Nix (macOS only — Linux legs already have it via container)
        if: matrix.container == ''
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # ─────────────────────────────────────────────────────────
      # Cachix
      # ─────────────────────────────────────────────────────────

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ─────────────────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────────────────

      - name: 🔨 Build ${{ matrix.profile }}
        run: |
          nix build \
            .#${{ matrix.profile }} \
            --print-out-paths \
            --no-update-lock-file

      # ─────────────────────────────────────────────────────────
      # Push complete closure to Cachix
      # ─────────────────────────────────────────────────────────

      - name: 🚀 Push to Cachix
        run: |
          nix path-info \
            --recursive \
            .#${{ matrix.profile }} \
            | cachix push schrovimger


  # ─────────────────────────────────────────────────────────────
  # Validate the complete flake
  #
  # Runs independently so it doesn't have to wait for every
  # profile/architecture build.
  # ─────────────────────────────────────────────────────────────

  flake-check-all-systems:
    name: 🔍 Full flake check (all systems)
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────────────────

      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      # ─────────────────────────────────────────────────────────
      # Nix
      # ─────────────────────────────────────────────────────────

      - name: 🧊 Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # ─────────────────────────────────────────────────────────
      # Check
      # ─────────────────────────────────────────────────────────

      - name: 🔍 Run flake checks
        run: |
          nix flake check \
            --all-systems \
            --no-update-lock-file
