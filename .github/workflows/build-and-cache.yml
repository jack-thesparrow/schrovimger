# 🚀 Build & Cache: Runs on push to main, builds every profile for every
# supported system on its native runner, and pushes closures to Cachix.

name: 🚀 Build & Cache

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-cache:
    name: 📦 ${{ matrix.profile }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, cpp, rust, python, java, full]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🧊 Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔨 Build ${{ matrix.profile }} (${{ matrix.system }})
        run: nix build .#${{ matrix.profile }} --print-out-paths

      - name: 🚀 Push to Cachix
        run: |
          nix path-info --recursive .#${{ matrix.profile }} | cachix push schrovimger

  flake-check-all-systems:
    name: 🔍 Full flake check (all systems)
    runs-on: ubuntu-latest
    needs: build-and-cache
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🧊 Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔍 Run flake checks (all systems)
        run: nix flake check --all-systems --no-update-lock-file
