# 🚀 Build & Cache: Runs on push to main, builds profiles for supported
# systems and pushes closures to Cachix. Linux legs run inside a
# Nix-preinstalled container (no installer step); macOS still needs the
# Determinate Systems installer since GitHub Actions containers aren't
# supported on macOS runners.

name: 🚀 Build & Cache

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  build-and-cache:
    name: 📦 ${{ matrix.profile }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-linux: every profile, in a Nix-preinstalled container.
          - profile: minimal
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest
          - profile: cpp
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest
          - profile: rust
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest
          - profile: python
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest
          - profile: java
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest
          - profile: full
            system: x86_64-linux
            runner: ubuntu-latest
            container: nixos/nix:latest

          # aarch64-linux: smoke-test with minimal + full only.
          - profile: minimal
            system: aarch64-linux
            runner: ubuntu-24.04-arm
            container: nixos/nix:latest
          - profile: full
            system: aarch64-linux
            runner: ubuntu-24.04-arm
            container: nixos/nix:latest

          # aarch64-darwin: smoke-test with minimal + full only.
          # No container support on macOS runners, so container is empty
          # and the Determinate Systems installer step below runs instead.
          - profile: minimal
            system: aarch64-darwin
            runner: macos-latest
            container: ""
          - profile: full
            system: aarch64-darwin
            runner: macos-latest
            container: ""

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🧊 Install Nix (macOS only — Linux legs already have it via container)
        if: matrix.container == ''
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔨 Build ${{ matrix.profile }} (${{ matrix.system }})
        run: nix build .#${{ matrix.profile }} --print-out-paths

      - name: 🚀 Push to Cachix
        run: |
          nix path-info --recursive .#${{ matrix.profile }} | cachix push schrovimger

  flake-check-all-systems:
    name: 🔍 Full flake check (all systems)
    runs-on: ubuntu-latest
    container: nixos/nix:latest
    needs: build-and-cache
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🧊 Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: 📦 Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: schrovimger
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: 🔍 Run flake checks (all systems)
        run: nix flake check --all-systems --no-update-lock-file
